<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>文化祭は終了しました</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #243047;
        background: #f4f7fb;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 560px);
        padding: clamp(32px, 8vw, 56px) 28px;
        border: 1px solid #e1e8f0;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 20px 60px rgb(29 48 75 / 10%);
        text-align: center;
      }

      .icon {
        display: grid;
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        place-items: center;
        border-radius: 50%;
        background: #fff0dc;
        color: #bd6813;
        font-size: 34px;
      }

      h1 {
        margin: 0;
        font-size: clamp(25px, 6vw, 34px);
        line-height: 1.4;
      }

      p {
        margin: 16px 0 0;
        color: #586579;
        font-size: 16px;
        line-height: 1.9;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">🎉</div>
      <h1>文化祭は終了しました</h1>
      <p>ご来場いただき、ありがとうございました。</p>
    </main>
  </body>
</html>
